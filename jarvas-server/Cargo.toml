[package]
name = "jarvas-server"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "jarvas-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png"] }
rmcp = { version = "3.11", features = ["server", "transport-io"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["macros", "rt", "io-std", "sync"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
